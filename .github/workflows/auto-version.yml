name: Auto version bump

on:
  push:
    branches: [dev, ci/semver-releases] # TEMP: testing only, will narrow back to [dev] before merge

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "$LATEST_TAG"..HEAD --pretty=format:%s)
          else
            COMMITS=$(git log --pretty=format:%s)
          fi
          echo "Commits since $LATEST_TAG:"
          echo "$COMMITS"

          # feat: -> minor bump. Everything else (fix/docs/ci/chore/refactor/...) -> patch bump.
          # Major is never auto-bumped, even for a breaking-change commit - that's a deliberate,
          # manually-triggered decision (see major-version.yml).
          if echo "$COMMITS" | grep -qE '^feat(\(.+\))?!?:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMP=minor
          else
            PATCH=$((PATCH + 1))
            BUMP=patch
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $BUMP: $LATEST_TAG -> v$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update gradle.properties
        run: |
          sed -i "s/^projectVersion=.*/projectVersion=${{ steps.version.outputs.new_version }}/" gradle.properties

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_tag }} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"
          gh release create "${{ steps.version.outputs.new_tag }}" \
            --title "${{ steps.version.outputs.new_tag }}" \
            --generate-notes
