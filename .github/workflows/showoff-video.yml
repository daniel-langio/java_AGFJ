name: Generate show-off video

on:
  workflow_dispatch: {}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build video-export jar
        run: ./gradlew lwjgl3:videoExportJar --console=plain

      - name: Render ball-bounce scene to video
        run: |
          xvfb-run -a java -jar lwjgl3/build/libs/AGFJ-video-export-1.0.0.jar assets/data/video/ball-bounce.json

      - uses: actions/upload-artifact@v4
        with:
          name: ball-bounce-showoff
          path: output/ball-bounce.mp4
          retention-days: 30

      - name: Render two-balls-collide scene to video
        run: |
          xvfb-run -a java -jar lwjgl3/build/libs/AGFJ-video-export-1.0.0.jar assets/data/video/two-balls-collide.json

      - uses: actions/upload-artifact@v4
        with:
          name: two-balls-collide-showoff
          path: output/two-balls-collide.mp4
          retention-days: 30
