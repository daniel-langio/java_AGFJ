name: Generate show-off video

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build video-export jar
        run: ./gradlew lwjgl3:videoExportJar --console=plain

      - name: Render ball-bounce scene to video
        run: |
          xvfb-run -a java -jar lwjgl3/build/libs/AGFJ-video-export-1.0.0.jar assets/data/video/ball-bounce.json

      - uses: actions/upload-artifact@v4
        with:
          name: ball-bounce-showoff
          path: output/ball-bounce.mp4
          retention-days: 30

      - name: Render two-balls-collide scene to video
        run: |
          xvfb-run -a java -jar lwjgl3/build/libs/AGFJ-video-export-1.0.0.jar assets/data/video/two-balls-collide.json

      - uses: actions/upload-artifact@v4
        with:
          name: two-balls-collide-showoff
          path: output/two-balls-collide.mp4
          retention-days: 30

      - name: Publish videos to a rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete showoff-latest --yes --cleanup-tag || true
          gh release create showoff-latest \
            output/ball-bounce.mp4 \
            output/two-balls-collide.mp4 \
            --title "Show-off videos (latest)" \
            --notes "Regenerated by showoff-video.yml, run ${{ github.run_id }}. Overwritten on every trigger - not a versioned history." \
            --target "${{ github.sha }}"
